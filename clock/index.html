<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f0f0f0' stroke-width='3'/%3E%3Cpath d='M16 9v7.5l5 3' fill='none' stroke='%23f0f0f0' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
/* 配色取自参考图：底 #000 / 指针与数字 #fff / 秒针 #fa9f22 / 刻度 #575757 */
body{
  background:#000;color:#f0f0f0;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;
}
#stage{position:relative}
#dial{display:block}
#meta{
  position:absolute;top:100%;left:0;right:0;margin-top:1em;text-align:center;white-space:nowrap;
  font-size:clamp(12px,.16em,72px);font-weight:400;color:#8d8d8d;letter-spacing:.02em;
  opacity:0;transform:translateY(-6px);
  transition:opacity .3s ease,transform .3s ease;
  pointer-events:none;
}
body.on #meta{opacity:1;transform:translateY(0)}
#bar{position:fixed;top:0;right:0;z-index:4;display:flex}
#bar button{width:58px;height:58px;padding:0;border:0;background:none;color:inherit;
  cursor:pointer;opacity:.26;line-height:1;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;letter-spacing:.02em;font-family:inherit;
  transition:opacity .2s ease;-webkit-tap-highlight-color:transparent}
#bar button:hover{opacity:1}
@media (hover:none){#bar button{opacity:.45}}
#th::after{content:"";width:0;height:0;margin-left:3px;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4px solid currentColor}
#fs svg{display:block;width:26px;height:26px}
#fs .i2{display:none}
body.fs #fs .i1{display:none}
body.fs #fs .i2{display:block}
#twrap{position:relative}
#tm{position:absolute;top:52px;right:0;z-index:5;display:flex;flex-direction:column;gap:2px;
  padding:6px;min-width:118px;border:1px solid #2c2c2c;border-radius:12px;background:#141414;
  box-shadow:0 10px 30px rgba(0,0,0,.7)}
#tm[hidden]{display:none}
#tm>*{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;
  color:#e8e8e8;text-decoration:none;cursor:pointer;
  font:500 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
#tm>*::before{content:"";width:6px;height:6px;border-radius:50%;background:transparent}
#tm>.cur{font-weight:700}
#tm>.cur::before{background:#fa9f22}
#tm>a:hover{background:#232323}
#hot{position:fixed;left:0;right:0;bottom:0;height:32vh;z-index:2}
@media (max-width:480px){#hot{height:42vh}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="dial"></canvas>
  <div id="meta"></div>
</div>
<div id="bar">
  <div id="twrap">
    <button id="th" type="button" title="主题：时钟">时钟</button>
    <div id="tm" hidden>
      <a href="../">时间</a>
      <span class="cur">时钟</span>
    </div>
  </div>
  <button id="fs" title="全屏" aria-label="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="i1" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="i2" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  </div>
</div>
<div id="hot"></div>
<script>
(function(){
  var TAU=6.283185307,
      cv=document.getElementById('dial'),ctx=cv.getContext('2d'),
      stage=document.getElementById('stage'),m=document.getElementById('meta'),
      hot=document.getElementById('hot'),face=document.createElement('canvas'),
      W='日一二三四五六',lastDay='',S=0,R=0,DPR=1,lastS=0,raf=0,lastTs=0;

  function pad(n){return n<10?'0'+n:''+n}

  /* ===== 服务器时间：表盘走的是服务器时间，不信任访客设备时钟 =====
     ① 若服务器提供毫秒级接口，把 API 填成它的地址即可最准（支持返回毫秒数，或 {"t":毫秒} /
        {"timestamp":毫秒} / {"now":毫秒} / {"data":{"t":毫秒}}）；
     ② 未配 API 时，对同源地址发 HEAD 请求，读 HTTP 响应头 Date —— nginx/Apache/Node/Python
        等静态服务器都会自动带上，无需任何后端；
     ③ 两者都拿不到（离线 / 直接用 file:// 打开）则回退设备本地时间，表盘照常走。
     关于精度（已实测）：Date 头只精确到整秒，单次取样只能定到 ±0.5 秒，且同一秒内的多次取样
     相位相同、取平均无效。因此按 150ms 间隔连取 8 次（跨度约 1.05 秒），一旦 Date 的秒数发生
     跳变，就说明该整秒边界落在相邻两次取样之间，可把相位锁定到约 ±75ms，比单次准 6 倍以上；
     若 Date 被 CDN 缓存住（秒数不跳变）则退回「整秒中点」法，保证仍能用。
     时间锚定方式：本地单调钟走时 + (服务器−本地) 偏移，每 5 分钟或页面重新可见时自动校准。 */
  var API='',        /* 毫秒级接口地址，例如 '/api/time'；留空则用响应头 Date */
      TZ=null,       /* null=跟随访客设备时区；填数字如 8 则固定为 UTC+8（北京时间） */
      SRV=0, SYNC_AT=0, syncing=0, SYNC_KEY='srvSkew', SAMPLES=8, GAP=150;
  function srvNow(){return Date.now()+SRV}
  function cts(){
    return window.performance&&performance.now?performance.timeOrigin+performance.now():Date.now();
  }
  function apiMs(t){
    var s=t.trim(),n=/^-?\d{9,14}$/.exec(s);
    if(n)return +s;
    try{
      var j=JSON.parse(s),v=typeof j==='number'?j:(j.t||j.timestamp||j.now||j.ms||
        (j.data&&(j.data.t||j.data.timestamp)));
      if(v!=null)return +v;
    }catch(e){}
    var d=Date.parse(s);return isNaN(d)?NaN:d;
  }
  /* 单次取样：返回 {v:服务器整秒毫秒值 或 exact:精确毫秒, t0/t1:请求起止本地毫秒} */
  function probe(){
    if(!window.fetch)return Promise.reject(0);
    var t0=cts(),
        u=(API||location.pathname)+'?_='+Math.random().toString(36).slice(2),
        o={cache:'no-store'};
    if(!API)o.method='HEAD';
    return fetch(u,o).then(function(r){
      var t1=cts();
      if(API)return r.text().then(function(b){
        var v=apiMs(b);if(isNaN(v))throw 0;
        return {exact:v,t0:t0,t1:t1};
      });
      var h=r.headers.get('date'),v=h?Date.parse(h):NaN;
      if(isNaN(v))throw 0;
      return {v:v,t0:t0,t1:t1};
    });
  }
  function mid(x){return (x.t0+x.t1)/2}
  /* 由样本估算「服务器 − 本地」偏移 */
  function skewOf(s){
    var br=[],raw=[],i,x,t=0;
    for(i=0;i<s.length;i++){
      x=s[i];
      if(x.exact!=null)return x.exact-mid(x);          /* 毫秒接口：精确 */
      raw.push(x.v+500-mid(x));                        /* 兜底：整秒中点 */
      if(i&&x.v-s[i-1].v===1)                          /* 秒数跳变：边界必在两次取样之间 */
        br.push(x.v*1000-(mid(s[i-1])+mid(x))/2);
    }
    if(br.length){for(i=0;i<br.length;i++)t+=br[i];return t/br.length}
    for(i=0;i<raw.length;i++)t+=raw[i];return t/raw.length;
  }
  function skewApply(v,save){
    SRV=Math.round(v);SYNC_AT=Date.now();
    if(save){try{localStorage.setItem(SYNC_KEY,SRV+','+SYNC_AT)}catch(e){}}
    draw();renderDate();
  }
  function sync(){
    if(syncing)return;
    syncing=1;
    var got=[],want=API?2:SAMPLES,n=0,timer=setTimeout(finish,3000);
    function step(){if(++n>=want)finish()}
    function one(){
      probe().then(function(x){
        got.push(x);
        skewApply(skewOf(got),0);   /* 每取到一笔就先校准：首笔即让表盘切到服务器时间 */
        step();
      },step);
    }
    function finish(){
      clearTimeout(timer);syncing=0;
      if(got.length)skewApply(skewOf(got),1);   /* 全部取完再定稿（含跨秒相位）并落盘 */
    }
    for(var j=0;j<want;j++)setTimeout(one,j*(API?0:GAP));
  }
  /* 首屏先用上次的同步结果，避免「先走错时间再跳一下」 */
  try{
    var csk=localStorage.getItem(SYNC_KEY);
    if(csk){var csa=csk.split(',');if(Date.now()-+csa[1]<864e5)SRV=+csa[0]||0}
  }catch(e){}
  sync();
  addEventListener('online',sync);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&Date.now()-SYNC_AT>6e4)sync();
  });
  setInterval(function(){if(!document.hidden&&Date.now()-SYNC_AT>12e4)sync()},3e5);

  /* 取时间字段：TZ 为 null 用访客设备时区，为数字则固定该 UTC 偏移 */
  function F(ms){
    var u=TZ!=null,d=new Date(u?ms+TZ*36e5:ms);
    function q(n){return d[u?'getUTC'+n:'get'+n]()}
    return {y:q('FullYear'),mo:q('Month'),d:q('Date'),h:q('Hours'),
            mi:q('Minutes'),s:q('Seconds'),wd:q('Day')};
  }
  function isoWeek(y,mo,dt){
    var x=new Date(Date.UTC(y,mo,dt));
    x.setUTCDate(x.getUTCDate()+4-((x.getUTCDay()+6)%7));
    var s=new Date(Date.UTC(x.getUTCFullYear(),0,1));
    return Math.ceil(((x-s)/864e5+1)/7);
  }
  function clampMeta(){
    var mr=m.getBoundingClientRect();
    if(mr.width>innerWidth*.94)
      m.style.fontSize=Math.floor(parseFloat(getComputedStyle(m).fontSize)*innerWidth*.94/mr.width)+'px';
  }
  function fit(){
    S=Math.max(90,Math.floor(Math.min(innerWidth*.9,innerHeight*.78)));
    cv.style.width=S+'px';cv.style.height=S+'px';
    DPR=Math.min(3,window.devicePixelRatio||1);
    cv.width=Math.round(S*DPR);cv.height=Math.round(S*DPR);
    /* 绘制半径比画布半径小 4%：标签(60/45/15)本来就贴在表盘最外沿，留出余量才不会被裁 */
    R=S/2*.96;
    stage.style.fontSize=Math.round(S*.24)+'px';
    m.style.fontSize='';clampMeta();
    faceBuild();draw();
  }

  /* 静态表盘预渲染：刻度 60 根(0.926R~0.99R)、5 分钟位置用两位数字标签、大数字 1-12 */
  function faceBuild(){
    var d=Math.round(S*DPR);
    if(!d||(lastS===S&&face.width===d))return;
    lastS=S;
    face.width=d;face.height=d;
    var f=face.getContext('2d'),a,i,r=R;
    f.setTransform(DPR,0,0,DPR,0,0);
    f.clearRect(0,0,S,S);
    f.translate(S/2,S/2);
    f.strokeStyle='#575757';
    f.lineWidth=Math.max(1,r*.0105);
    f.fillStyle='#ffffff';
    f.textAlign='center';f.textBaseline='middle';
    f.font='500 '+(r*.086)+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    for(i=0;i<60;i++){
      a=i/60*TAU;
      if(i%5===0){
        f.fillText(pad(i||60),Math.sin(a)*r*.966,-Math.cos(a)*r*.966);
      }else{
        f.beginPath();
        f.moveTo(Math.sin(a)*r*.926,-Math.cos(a)*r*.926);
        f.lineTo(Math.sin(a)*r*.99,-Math.cos(a)*r*.99);
        f.stroke();
      }
    }
    f.font='400 '+(r*.294)+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    for(i=1;i<=12;i++){
      a=i/12*TAU;
      f.fillText(i,Math.sin(a)*r*.75,-Math.cos(a)*r*.75);
    }
  }

  /* 锥形指针：根部窄(0.42×宽)、末段满宽并带圆头，不是等高长条 */
  function hand(len,w,deg,color){
    var w0=w*.42,tip=len-w/2;
    ctx.save();
    ctx.rotate(deg*.0174532925);
    ctx.beginPath();
    ctx.moveTo(-w0/2,0);
    ctx.lineTo(-w/2,-len*.3);
    ctx.lineTo(-w/2,-tip);
    ctx.arc(0,-tip,w/2,Math.PI,0,false);
    ctx.lineTo(w/2,-len*.3);
    ctx.lineTo(w0/2,0);
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
    ctx.restore();
  }
  function draw(){
    if(!S)return;
    var ms=srvNow(),p=F(ms),h=p.h%12,
        se=p.s+(ms%1000)/1000;   /* 亚秒部分只取毫秒，故固定时区整小时偏移不影响 */
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,S,S);
    ctx.drawImage(face,0,0,S,S);
    ctx.translate(S/2,S/2);
    /* 时针明显短于分针(0.53R vs 0.80R)，长度差足够一眼分辨；分针末段会压到数字，属预期 */
    hand(R*.53,R*.065,(h+p.mi/60)*30,'#ffffff');
    hand(R*.80,R*.055,(p.mi+se/60)*6,'#ffffff');
    /* 轴心：白盘 → 橙色秒针(穿过中心留尾巴) → 橙轴盖 → 黑钉 */
    ctx.beginPath();ctx.arc(0,0,R*.04,0,TAU);ctx.fillStyle='#ffffff';ctx.fill();
    ctx.save();
    /* 秒针：se 是「秒」，须再乘 6 才是角度(6°/秒)，故直接用 TAU/60 换算 */
    ctx.rotate(se*TAU/60);
    ctx.beginPath();
    ctx.lineCap='round';ctx.lineWidth=Math.max(1,R*.011);ctx.strokeStyle='#fa9f22';
    ctx.moveTo(0,R*.17);ctx.lineTo(0,-R*.986);ctx.stroke();
    ctx.restore();
    ctx.beginPath();ctx.arc(0,0,R*.03,0,TAU);ctx.fillStyle='#fa9f22';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,R*.015,0,TAU);ctx.fillStyle='#000000';ctx.fill();
    ctx.setTransform(1,0,0,1,0,0);
  }
  /* 秒针平滑走时：约 25fps，够顺滑又不费电；页面隐藏时 rAF 自动暂停 */
  function tick(ts){
    raf=requestAnimationFrame(tick);
    if(ts-lastTs>40){lastTs=ts;draw()}
  }
  function renderDate(){
    var p=F(srvNow()),day=p.y+'-'+p.mo+'-'+p.d;
    if(day!==lastDay){
      lastDay=day;
      m.textContent=p.y+'年'+(p.mo+1)+'月'+p.d+'日星期'+W[p.wd]+'，第'+isoWeek(p.y,p.mo,p.d)+'周';
    }
  }
  function loop(){renderDate();setTimeout(loop,1000-srvNow()%1000+5)}

  /* 主题：鼠标移入即展开；触屏改为点按开关 */
  var wrap=document.getElementById('twrap'),tm=document.getElementById('tm'),
      th=document.getElementById('th'),tHide;
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
    wrap.addEventListener('mouseenter',function(){clearTimeout(tHide);tm.hidden=false});
    wrap.addEventListener('mouseleave',function(){clearTimeout(tHide);tHide=setTimeout(function(){tm.hidden=true},140)});
  }else{
    th.addEventListener('click',function(e){e.stopPropagation();tm.hidden=!tm.hidden});
    document.addEventListener('click',function(){tm.hidden=true});
  }
  addEventListener('keydown',function(e){if(e.key==='Escape')tm.hidden=true});

  addEventListener('resize',fit);
  addEventListener('orientationchange',fit);
  fit();
  loop();
  raf=requestAnimationFrame(tick);

  /* 全屏切换：图标同步为「进入/退出」，不支持全屏的设备（如 iPhone Safari）隐藏按钮 */
  var fsb=document.getElementById('fs'),de=document.documentElement,
      req=de.requestFullscreen||de.webkitRequestFullscreen;
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null}
  function syncFS(){document.body.classList.toggle('fs',!!fsEl());fit()}
  if(req)fsb.onclick=function(){
    if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else req.call(de);
  };
  else fsb.style.display='none';
  document.addEventListener('fullscreenchange',syncFS);
  document.addEventListener('webkitfullscreenchange',syncFS);

  /* 鼠标移到下方显示日期；触屏点按切换 */
  var on=function(){document.body.classList.add('on')},
      off=function(){document.body.classList.remove('on')};
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
    hot.addEventListener('mouseenter',on);
    hot.addEventListener('mouseleave',off);
  }else{
    hot.addEventListener('click',function(){document.body.classList.toggle('on')});
  }
  addEventListener('blur',off);
  document.addEventListener('visibilitychange',function(){if(document.hidden)off()});
})();
</script>
</body>
</html>
